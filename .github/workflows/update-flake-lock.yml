name: Update Flake Lock

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Update inputs
        run: nix flake update
      - name: Create evaluation hardware configuration
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { ... }: {
            fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
            fileSystems."/boot" = { device = "none"; fsType = "tmpfs"; };
          }
          EOF
      - name: Run repository checks
        run: nix flake check --print-build-logs "path:."
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: maintenance/flake-lock
          commit-message: 'chore: update flake inputs'
          title: 'chore: update flake inputs'
          body: 'Weekly flake input update. All repository checks were built before opening this PR.'
          add-paths: flake.lock
