name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Create evaluation hardware configuration
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { ... }: {}
          EOF

      - name: Evaluate flake
        run: nix flake check --no-build "path:."

      - name: Run repository checks
        run: |
          nix build "path:.#checks.x86_64-linux.formatting"
          nix build "path:.#checks.x86_64-linux.shell-syntax"

      - name: Dry-build NixOS configuration
        run: nix build --dry-run "path:.#nixosConfigurations.clara.config.system.build.toplevel"
