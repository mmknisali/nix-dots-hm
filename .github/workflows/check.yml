name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Create evaluation hardware configuration
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { ... }: {
            fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
            fileSystems."/boot" = { device = "none"; fsType = "tmpfs"; };
          }
          EOF

      - name: Run repository checks
        run: nix flake check --print-build-logs "path:."

      - name: Dry-build NixOS configuration
        run: nix build --dry-run "path:.#nixosConfigurations.clara.config.system.build.toplevel"
